<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKView — Fast Results Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #5227FF;
      --secondary: #FF9FFC;
      --bg: #030303;
      --glass: rgba(255, 255, 255, 0.02);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.7);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0; background: #000; color: var(--text);
      font-family: 'Outfit', sans-serif;
      display: grid; place-items: center;
      min-height: 100vh; width: 100vw;
      overflow: hidden;
    }

    /* Silk Background */
    #silk-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none;
    }

    .container {
      width: 90%; max-width: 400px;
      text-align: center;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative; z-index: 10;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    .logo {
      font-size: 46px; font-weight: 400; letter-spacing: -1.5px; margin-bottom: 15px;
      color: #fff; display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .logo b {
      background: var(--primary); color: #fff; padding: 0 10px; border-radius: 8px;
      font-weight: 800; box-shadow: 0 0 20px rgba(82, 39, 255, 0.4);
    }
    .logo span { font-weight: 300; opacity: 0.9; }

    .counter-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border);
      padding: 6px 18px; border-radius: 100px;
      font-size: 12px; font-weight: 700; color: var(--secondary);
      backdrop-filter: blur(20px); margin-bottom: 35px;
    }
    .pulse { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
      backdrop-filter: blur(80px) saturate(200%);
      -webkit-backdrop-filter: blur(80px) saturate(200%);
      border: 0.5px solid var(--glass-border);
      border-radius: 50px; padding: 50px;
      box-shadow: 
        0 40px 80px rgba(0,0,0,0.7),
        inset 0 0 0 0.5px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    /* Glass Texture Grain */
    .glass-card::after {
      content: ""; position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.04; pointer-events: none; z-index: 1;
    }

    .glass-card::before {
      content: ""; position: absolute; inset: -1px; padding: 1px; border-radius: 50px;
      background: radial-gradient(300px circle at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 0.3), transparent 50%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
      z-index: 2;
    }
    .glass-card:hover::before { opacity: 1; }

    .glass-card > * { position: relative; z-index: 5; }

    .btn-primary {
      display: block; width: 100%; padding: 22px; background: #fff;
      color: #000; text-decoration: none; border-radius: 20px;
      font-weight: 800; font-size: 18px; margin-bottom: 12px;
      transition: all 0.3s; border: none; cursor: pointer;
    }
    .btn-primary:active { transform: scale(0.96); }

    .btn-hunter {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
      color: #fff; width: 100%; padding: 18px; border-radius: 20px;
      font-weight: 600; font-size: 14px; cursor: pointer;
      margin-bottom: 30px; transition: all 0.2s;
    }

    .info-section { text-align: left; }
    .info-section h3 { font-size: 14px; color: var(--secondary); margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 1px; }
    .info-section p { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; margin: 0 0 12px 0; }
    .info-section strong { color: #fff; }

    .footer { margin-top: 40px; text-align: center; font-size: 13px; color: var(--text-dim); width: 100%; }
    .footer strong { color: #fff; }
    .footer .kinnova { font-size: 11px; margin-top: 5px; letter-spacing: 2px; color: var(--primary); font-weight: 800; }

    #loadingOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; text-align: center;
    }
    .loader-ring {
      width: 80px; height: 80px; border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--primary); border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 25px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { font-weight: 800; font-size: 20px; color: #fff; margin-bottom: 10px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="loadingOverlay">
    <div class="loader-ring"></div>
    <div class="loading-text">SKVIEW TUNNELING</div>
    <div id="statusText" style="color: rgba(255,255,255,0.6); font-size: 13px;">SECURING CONNECTION...</div>
  </div>

  <div id="silk-bg"></div>

  <div class="container">
    <div class="logo"><b>SK</b><span>View</span></div>
    <div class="counter-pill">
      <div class="pulse"></div>
      <span id="visitCounter">0</span> Students Got Results
    </div>

    <div class="glass-card">
      <button class="btn-primary" onclick="startRedirect()">ENTER COE MAIN</button>
      <button class="btn-hunter" onclick="toggleHunter()" id="hunterBtn">USE HUNTER MODE</button>

      <div class="info-section">
        <h3>Gateway Guide:</h3>
        <p>1. Ensure your internet connection is stable before entering.</p>
        <p>2. Click <strong>ENTER COE MAIN</strong> to initiate the secure tunnel.</p>
        <p>3. If the server is extremely congested, toggle <strong>"Hunter Mode"</strong>.</p>
      </div>
    </div>

    <footer class="footer">
      <div>Founder: <strong>KK_947</strong></div>
      <div class="kinnova">KINNOVA TECH</div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
